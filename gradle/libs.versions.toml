documentFile = "1.0.1"
coroutines = "1.8.1"
serialization = "1.6.3"
datetime = "0.6.0"
sqldelight = "2.0.2"
coil = "2.6.0"
playServicesAuth = "21.6.0"
workManager = "2.10.5"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
